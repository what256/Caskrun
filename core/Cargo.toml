[package]
name = "caskrun-core"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
flate2 = { version = "=1.1.10", default-features = false, features = ["miniz_oxide"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = { version = "=0.4.46", default-features = false }
uuid = { version = "1", features = ["v4"] }
