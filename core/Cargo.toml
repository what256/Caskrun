[package]
name = "caskrun-core"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
flate2 = { version = "=1.1.10", default-features = false, features = ["miniz_oxide"] }
libc = "=0.2.189"
quick-xml = { version = "=0.42.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = { version = "=0.4.46", default-features = false }
uuid = { version = "1", features = ["v4"] }

# Use RustCrypto's ARM SHA instructions for full engine
# verification. The upstream implementation retains its software fallback.
[target.'cfg(target_arch = "aarch64")'.dependencies]
sha2 = { version = "0.10", features = ["asm-aarch64"] }
